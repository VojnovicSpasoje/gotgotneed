name: Vendor fonts
on:
  workflow_dispatch:
  push:
    paths: ['tools/fonts-url.txt', 'tools/vendor-fonts.py', '.github/workflows/vendor-fonts.yml']
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/vendor-fonts.py
      - name: Commit fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fonts
          git commit -m "Update self-hosted fonts" || echo "no changes"
          git pull --rebase origin main && git push
