name: Store screenshots
on:
  workflow_dispatch:
  push:
    paths: ['tools/store-shots.mjs', '.github/workflows/store-shots.yml', 'tools/shots-trigger.txt']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: sleep 60   # let GitHub Pages publish the latest version first
      - run: node tools/store-shots.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store
          git commit -m "Update Play Store screenshots" || echo "no changes"
          git push
