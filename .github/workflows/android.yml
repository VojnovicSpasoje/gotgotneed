name: Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'index.html', 'fonts/**', 'icons/**', 'assets/**', 'capacitor.config.json', 'package.json', 'package-lock.json', 'tools/android/**', 'tools/build-app-web.mjs', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.GGN_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Install (locked versions once package-lock.json exists)
        run: bash tools/android/ci-step.sh npm install --no-audit --no-fund   # respects package-lock.json; updates it (and it gets committed) only when package.json changed
      - name: Security audit of app dependencies
        run: bash tools/android/ci-step.sh npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Web part for the app
        env: { GGN_VERSION_CODE: '${{ github.run_number }}' }
        run: node tools/build-app-web.mjs
      - name: Create and harden the Android project
        env:
          GGN_VERSION_CODE: ${{ github.run_number }}
          GGN_VERSION_NAME: '1.0'
        run: |
          S="bash tools/android/ci-step.sh"
          $S npx cap add android
          $S npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#0E131B'
          $S python3 tools/android/patch.py
          $S npx cap sync android
      - name: Build test APK (includes test tools)
        # Signed with a fixed TEST key kept in the repo, so each new test build installs over the previous one.
        # It is not the Play key: Play builds are signed with the upload key from GitHub Secrets (below) and by Google.
        env:
          GGN_TEST_KEY_PASSWORD: 'fLwWfgGn1PMZyPGplF6LUN9l'
        run: |
          export GGN_KEYSTORE="$GITHUB_WORKSPACE/tools/android/test-signing.p12" GGN_KEY_ALIAS=ggn-test
          export GGN_KEYSTORE_PASSWORD="$GGN_TEST_KEY_PASSWORD" GGN_KEY_PASSWORD="$GGN_TEST_KEY_PASSWORD"
          cd android && bash ../tools/android/ci-step.sh ./gradlew --no-daemon assembleRelease
      - run: |
          mkdir -p out && cp android/app/build/outputs/apk/release/*.apk out/GotGotNeed-test.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs out/GotGotNeed-test.apk | grep -E "Signer #1 certificate (DN|SHA-256)" | tee out/signature.txt
      - name: Build Play bundle (AAB, no test tools)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          GGN_KEYSTORE_B64: ${{ secrets.GGN_KEYSTORE_B64 }}
          GGN_KEYSTORE_PASSWORD: ${{ secrets.GGN_KEYSTORE_PASSWORD }}
          GGN_KEY_ALIAS: ${{ secrets.GGN_KEY_ALIAS }}
          GGN_KEY_PASSWORD: ${{ secrets.GGN_KEY_PASSWORD }}
        run: |
          echo "$GGN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export GGN_KEYSTORE="$RUNNER_TEMP/upload.jks"
          GGN_VERSION_CODE=${{ github.run_number }} node tools/build-app-web.mjs --release && npx cap copy android
          cd android && ./gradlew --no-daemon bundleRelease && cp app/build/outputs/bundle/release/*.aab ../out/GotGotNeed-play.aab
          rm -f "$GGN_KEYSTORE"
      - uses: actions/upload-artifact@v4
        with: { name: GotGotNeed-android, path: out/, retention-days: 30 }
      - name: Publish the test APK (GitHub release "test-build", for testers)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build out/GotGotNeed-test.apk --prerelease --title "Test build ${{ github.run_number }}" \
            --notes "Test version of the GotGotNeed Android app (includes test tools). Not for Google Play." 
      - name: Save package-lock.json (pins exact versions)
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json && git commit -m "Pin Android app dependency versions" && git pull --rebase origin main && git push
          fi

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: GotGotNeed-android, path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start the app on an emulator and look for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r out/GotGotNeed-test.apk
            adb logcat -c
            adb shell monkey -p app.gotgotneed -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > out/screen-light.png
            adb shell pidof app.gotgotneed > out/pid.txt || echo "NOT RUNNING" > out/pid.txt
            adb shell cmd uimode night yes
            adb shell am force-stop app.gotgotneed
            adb shell monkey -p app.gotgotneed -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > out/screen-dark.png
            adb shell dumpsys package app.gotgotneed | grep -E "permission|targetSdk|versionName|versionCode|flags=" > out/package-info.txt || true
            adb logcat -d > out/logcat.txt
      - name: Check result
        run: |
          cat out/pid.txt; grep -E "FATAL EXCEPTION|Capacitor/Console.*(Error|Uncaught)|Refused to" out/logcat.txt | head -40 || true
          ! grep -q "NOT RUNNING" out/pid.txt
          ! grep -q "FATAL EXCEPTION" out/logcat.txt
      - name: Keep screenshots and logs on the ci-results branch
        if: always()
        run: |
          mkdir -p r && cp out/*.png out/*.txt r/ 2>/dev/null || true
          grep -E "Capacitor|chromium|AndroidRuntime|FATAL" out/logcat.txt | tail -400 > r/logcat-app.txt || true
          rm -f r/logcat.txt
          cd r && git init -q && git checkout -q -b ci-results && git add . \
            && git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "Smoke test ${{ github.run_number }}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
